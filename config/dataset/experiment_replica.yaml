main:
  device: cuda
  dataset: replica #hm3dsem, scannet, replica
  scene_id: office0
  split: val
  package_path: /home/SOME_USERNAME/HOV-SG/hovsg/
  dataset_path: /home/cesar/Documentos/Doutorado/Graph_3d_Scene/Replica/val
  raw_data_path: /data/hovsg/hm3dsem/data/versioned_data/hm3d-0.2/hm3d
  save_path: /home/cesar/Documentos/Doutorado/Graph_3d_Scene/saved_results/
  clip_model: open-clip
  seg_model: mobile-sam
dataset:
  hm3dsem:
    gt_skip_frames: 2
models:
  clip:
    type:  ViT-H-14 # ViT-L/14@336px # ViT-H-14
    checkpoint: Open-CLIP/checkpoints/laion2b_s32b_b79k.bin
    # checkpoint: checkpoints/ovseg_clipl14_9a1909.pth checkpoints/laion2b_s32b_b79k.bin
  mobile-sam:
    checkpoint: sam2/checkpoints/mobile_sam_vit_b_0b3195.pth
    type: vit_b
    points_per_side: 8
    pred_iou_thresh: 0.88
    points_per_batch: 144
    crop_n_layers: 0
    stability_score_thresh: 0.95
    min_mask_region_area: 100
  sam:
    checkpoint: sam2/checkpoints/sam_vit_l_0b3195.pth
    type: vit_l
    points_per_side: 12
    pred_iou_thresh: 0.88
    points_per_batch: 144
    crop_n_layers: 0
    stability_score_thresh: 0.95
    min_mask_region_area: 100
pipeline:
  create_graph: True
  voxel_size: 0.02
  skip_frames: 10
  init_overlap_thresh: 0.75
  overlap_thresh_factor: 0.025
  iou_thresh: 0.05
  clip_masked_weight: 0.4418
  clip_bbox_margin: 50 # in pixels
  feature_dbscan_eps: 0.01
  max_mask_distance: 10000 # 6.4239 in meters
  min_pcd_points: 100
  depth_weighting: false
  grid_resolution: 0.05
  merge_type: sequential # hierarchical, sequential
  save_intermediate_results: false
  obj_labels: HM3DSEM_LABELS
  merge_objects_graph: false
  kf_threshold: 0.3
  downsample_rate: 10
  depth_thrunc: 12 # in meters
